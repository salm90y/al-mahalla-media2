name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Verify Android project structure
        run: |
          test -f android/gradlew
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Show build environment
        working-directory: ./android
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Clean Android project
        working-directory: ./android
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Lightweight Release APK
        working-directory: ./android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Single APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlMahalla-App-v1.1.0
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
